app:
  name: 'nestjs-portal-service'
  port: 30001
  zone: 'local'
  componentName: 'resource.portal-service'
  description: '[Example] management service'
  version: '1.0'
  collectionName: 'example.examples'
  baseApiVersion: '1.0.0'
  schemaVersion: '1.0.0'
  authToken: 'local-dev-token'

database:
  uri: mongodb://localhost:27017/portal-service

kafka:
  brokers:
    - localhost:9092
  consumer:
    groupId: portal-service-group
  producer:
    clientId: portal-service-producer

externalServices:
  userService:
    baseUrl: http://localhost:4001
    timeout: 5000
  paymentService:
    baseUrl: http://localhost:4002
    timeout: 10000

throttler:
  ttl: 10000
  limit: 20

log:
  detail:
    level: 'debug'
    enableFileLogging: false
    logFileProperties:
      dirname: 'logs/detail'
      filename: 'detail-%DATE%'
      datePattern: 'YYYY-MM-DD-HH'
      extension: '.log'
  summary:
    level: 'debug'
    enableFileLogging: false
    logFileProperties:
      dirname: 'logs/summary'
      filename: 'summary-%DATE%'
      datePattern: 'YYYY-MM-DD-HH'
      extension: '.log'

# ─── Feature Flags ────────────────────────────────
featureFlags:
  enableNewRegistration: true
  enablePaymentFlow: false
  enableKafkaConsumer: true

# nanoid:
#   alphanum: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"
#   len: 11

# kafka:
#   client:
#     client-id: "portal-service"
#   consumer:
#     group-id: "portal-service-grp"
#     allow-auto-topic-creation: true

topics:
  consume:
    atn:
      new-registration-response: 'esb.atn.registration.response.v1'
  produce:
    atn:
      new-registration-request: 'esb.atn.registration.request.v1'
      new-registration-response: 'esb.atn.registration.response.v1'
      change-package-request: 'esb.atn.package.change.request.v1'
      change-package-response: 'esb.atn.package.change.response.v1'
      activate-sim-request: 'esb.atn.sim.activate.request.v1'
      activate-sim-response: 'esb.atn.sim.activate.response.v1'
    sky:
      payment-request: 'esb.sky.payment.request.v1'
      payment-response: 'esb.sky.payment.response.v1'
      top-up-request: 'esb.sky.topup.request.v1'
      top-up-response: 'esb.sky.topup.response.v1'
    ccsm:
      customer-updated: 'esb.ccsm.customer.updated.v1'
      billing-updated: 'esb.ccsm.billing.updated.v1'

